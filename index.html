<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#1b1020">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Bhaag Cockroach Bhaag</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=__BUILD__">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/jsm/"}}</script>
  <script>window.BUILD = '__BUILD__';</script>
  <script src="/posthog-config.js"></script>
  <script>
    const posthogConfig = window.POSTHOG_CONFIG;
    window.POSTHOG_READY = Promise.resolve(null);
    if (!posthogConfig.projectToken) {
      if (posthogConfig.debug) throw new Error('POSTHOG_PROJECT_TOKEN variable required by PostHog is missing or un-configured, this causes events to be silently missed. This error stops appearing once POSTHOG_PROJECT_TOKEN is configured');
    } else if (!posthogConfig.host) {
      if (posthogConfig.debug) throw new Error('POSTHOG_HOST variable required by PostHog is missing or un-configured, this causes events to be silently missed. This error stops appearing once POSTHOG_HOST is configured');
    } else {
      window.POSTHOG_READY = new Promise((resolve) => {
        const posthogScript = document.createElement('script');
        posthogScript.async = true;
        posthogScript.src = `${posthogConfig.host.replace('.i.posthog.com', '-assets.i.posthog.com')}/static/array.js`;
        posthogScript.onload = () => {
          window.posthog.init(posthogConfig.projectToken, {
            api_host: posthogConfig.host,
            autocapture: false,
            disable_session_recording: true,
            respect_dnt: true,
            capture_exceptions: {
              capture_unhandled_errors: true,
              capture_unhandled_rejections: true,
              capture_console_errors: false,
            },
            logs: {
              serviceName: 'bhaag-cockroach-bhaag-web',
              environment: posthogConfig.debug ? 'development' : 'production',
            },
          });
          resolve(window.posthog);
        };
        posthogScript.onerror = () => resolve(null);
        document.head.append(posthogScript);
      });
    }
  </script>
</head>
<body>
  <canvas id="world"></canvas>
  <canvas id="hud"></canvas>
  <div id="msg" hidden></div>
  <div id="poster-ui" hidden>
    <label class="pill" for="poster-file">Add your posters</label>
    <input id="poster-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
    <button id="refresh-game" class="pill" type="button">Refresh game</button>
    <button id="poster-reset" class="pill" type="button" hidden>Reset posters</button>
    <small>Images stay on your device and are never uploaded.</small>
  </div>
  <script type="module" src="src/main.js?v=__BUILD__"></script>
</body>
</html>
